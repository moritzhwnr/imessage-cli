[project]
name = "imessage-mcp"
version = "0.1.0"
description = "An MCP server exposing your local iMessage history (macOS, read-only)."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "moritzhwnr", email = "moritz.hawener@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=1.27.1",
    "rich>=14.0.0",
    "typer>=0.25.1",
    "uvicorn>=0.47.0",
    "starlette>=1.0.0",
]
keywords = ["mcp", "imessage", "macos", "claude", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]

[project.urls]
Homepage = "https://github.com/moritzhwnr/imessage-cli"
Repository = "https://github.com/moritzhwnr/imessage-cli"
Issues = "https://github.com/moritzhwnr/imessage-cli/issues"

[project.scripts]
imessage-mcp = "imessage_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
