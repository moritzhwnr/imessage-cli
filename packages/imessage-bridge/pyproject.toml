[project]
name = "imessage-bridge"
version = "0.2.0"
description = "Connected CLI for imessage-mcp — stable public broker URL with account-managed API keys."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "moritzhwnr", email = "moritz.hawener@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "imessage-mcp>=0.1.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "questionary>=2.1.1",
    "rich>=14.0.0",
    "typer>=0.25.1",
]
keywords = ["mcp", "imessage", "macos", "claude", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]

[project.urls]
Homepage = "https://github.com/moritzhwnr/imessage-cli"
Repository = "https://github.com/moritzhwnr/imessage-cli"
Issues = "https://github.com/moritzhwnr/imessage-cli/issues"

[project.scripts]
imessage-bridge = "imessage_bridge.cli:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
